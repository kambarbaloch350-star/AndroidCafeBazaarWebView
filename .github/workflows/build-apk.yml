name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK (sent to Telegram)
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits generated branding (see "Apply branding")

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Repository cache service returns 400 for this account; Gradle's own
          # dependency cache inside the runner is enough for a clean build.
          cache-disabled: true

      - name: Ensure Gradle wrapper
        run: |
          chmod +x gradlew || true
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing – downloading the official Gradle 8.5 wrapper"
            mkdir -p gradle/wrapper
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar \
              -o gradle/wrapper/gradle-wrapper.jar
          fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          test -f gradle/wrapper/gradle-wrapper.jar && echo "Gradle wrapper verified."

      # services.gradle.org redirects to a GitHub release asset which occa-
      # sionally answers 500; the wrapper is retried a few times, then a direct
      # CDN download is used as a fallback.
      - name: Provision Gradle distribution
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              echo "Gradle distribution ready (attempt $attempt)."
              exit 0
            fi
            echo "::warning::Gradle distribution fetch failed (attempt $attempt); retrying…"
            rm -rf "$HOME/.gradle/wrapper/dists"/*/gradle-8.5-bin.zip.lck || true
            sleep 15
          done
          echo "::warning::Falling back to the Gradle CDN tarball"
          mkdir -p "$HOME/.gradle/wrapper/dists"
          curl -fL --retry 5 --retry-all-errors -o /tmp/gradle-8.5-bin.zip \
            https://downloads.gradle.org/distributions/gradle-8.5-bin.zip
          DIST_DIR=$(find "$HOME/.gradle/wrapper/dists" -maxdepth 1 -type d -name 'gradle-8.5-bin' | head -1)
          mkdir -p "$DIST_DIR/fallback/fallback"
          unzip -q -o /tmp/gradle-8.5-bin.zip -d "$DIST_DIR/fallback/fallback"
          touch "$DIST_DIR/fallback/fallback.ok"
          ./gradlew --version --no-daemon

      # Native-only configuration (Tapsell / Pushfa / Firebase). The production
      # identifiers are committed defaults in gradle.properties; repository
      # secrets override them when present (local.properties wins over
      # gradle.properties). app/google-services.json (Firebase project that Pushfa
      # delivers through) is committed; the GOOGLE_SERVICES_JSON secret, when set,
      # overrides it with the full file content.
      - name: Inject native configuration
        env:
          TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
          TAPSELL_ZONE_INTERSTITIAL: ${{ secrets.TAPSELL_ZONE_INTERSTITIAL }}
          TAPSELL_ZONE_REWARDED: ${{ secrets.TAPSELL_ZONE_REWARDED }}
          TAPSELL_ZONE_NATIVE: ${{ secrets.TAPSELL_ZONE_NATIVE }}
          PUSHFA_API_PUBLIC_KEY: ${{ secrets.PUSHFA_API_PUBLIC_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          add() { [ -n "$2" ] && echo "$1=$2" >> local.properties || true; }
          add TAPSELL_APP_KEY "$TAPSELL_APP_KEY"
          add TAPSELL_ZONE_INTERSTITIAL "$TAPSELL_ZONE_INTERSTITIAL"
          add TAPSELL_ZONE_REWARDED "$TAPSELL_ZONE_REWARDED"
          add TAPSELL_ZONE_NATIVE "$TAPSELL_ZONE_NATIVE"
          add PUSHFA_API_PUBLIC_KEY "$PUSHFA_API_PUBLIC_KEY"
          add FIREBASE_APP_ID "$FIREBASE_APP_ID"
          add FIREBASE_API_KEY "$FIREBASE_API_KEY"
          add FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID"
          add FIREBASE_SENDER_ID "$FIREBASE_SENDER_ID"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            python3 -c "import json,sys; json.load(open('app/google-services.json'))" \
              && echo "google-services.json installed (Firebase project enabled)"
          elif [ -f app/google-services.json ]; then
            echo "using the committed app/google-services.json"
          else
            echo "no google-services.json: building without Firebase (push disabled)"
          fi

      # Release signing: the release APK is what is delivered (Telegram) and
      # what goes to the CafeBazaar panel, so it must be signed. Put the
      # keystore (base64 of the .jks: `base64 -w0 release.jks`) and its
      # passwords in the repository secrets below; without them the release
      # variant is signed with the Android debug key so the delivered APK
      # still installs (with a warning in the build log).
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured – the release APK will be signed with the Android debug key (installable, but not the store key)"
            exit 0
          fi
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          add() { [ -n "$2" ] && printf '%s=%s\n' "$1" "$2" >> local.properties || true; }
          add RELEASE_KEYSTORE_PATH "$KS"
          add RELEASE_KEYSTORE_PASSWORD "$ANDROID_KEYSTORE_PASSWORD"
          add RELEASE_KEY_ALIAS "$ANDROID_KEY_ALIAS"
          add RELEASE_KEY_PASSWORD "${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          keytool -list -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null \
            && echo "release keystore loaded ($(printf '%s' "$ANDROID_KEY_ALIAS"))" \
            || { echo "::error::the configured keystore/password does not open"; exit 1; }

      # Branding: drop the logo at branding/logo-source.png (GitHub -> Add
      # file -> Upload files works) and this step renders every launcher icon,
      # the loading plate, the game's logo.png and the manifest icons, applies
      # the game patches that switch the menu/About tiles to it, and commits
      # the result back to the branch. branding/logo-source.sha256 records the
      # applied source, so the step is a no-op until the PNG changes. The APK
      # built below already contains the new branding.
      - name: Apply branding (branding/logo-source.png)
        if: github.event_name == 'push'
        run: |
          set -e
          SRC=branding/logo-source.png
          [ -f "$SRC" ] || { echo "no $SRC – branding unchanged"; exit 0; }
          SUM=$(sha256sum "$SRC" | cut -c1-64)
          if [ "$(cat branding/logo-source.sha256 2>/dev/null)" = "$SUM" ]; then
            echo "branding already applied for $SUM"; exit 0
          fi
          command -v convert >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          python3 tools/branding/apply_logo.py --source "$SRC"
          # The packaged game is the ChistanSara bundle (`assets/index-*.js`):
          # re-validate/refresh its patches after the branding rewrite. The
          # labzband `apply_patches.py` targets `App-*.js`, which this bundle
          # does not contain any more.
          python3 tools/game-patches/apply_chistan_patches.py
          echo "$SUM" > branding/logo-source.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Branding: apply branding/logo-source.png (launcher icons, loading plate, game logo)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "branding committed"; exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "::warning::could not push the generated branding – the APK of this run has it, the branch does not"

      # Pre-flight: the repository-level invariants (no removed advertising SDK,
      # every resource reference resolves, bridge contract present).
      - name: Static architecture checks
        run: python3 tools/static_checks.py

      # JVM unit tests: they boot the real LocalWebServer over the shipped
      # assets/web bundle and assert routing, MIME types, gzip, ETag and SPA
      # fallback, so a broken WebApp bundle cannot reach an APK.
      - name: Unit tests (embedded HTTP server + MIME table)
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build.log

      # WebApp contract: bundles the packaged game with esbuild, boots it in
      # jsdom against a scripted AndroidBridge (the exact TapsellManager /
      # Poolakey event protocol) and plays it: menu, spin wheel, coin packs,
      # two levels -> interstitial -> third level, ad time-outs, back button.
      - name: WebApp bridge contract (jsdom)
        run: |
          set -o pipefail
          npm install --no-save --no-audit --no-fund jsdom@30 esbuild@0.25 2>&1 | tail -2
          node tools/game-tests/run.mjs 2>&1 | tee -a build.log

      # Compiler/test diagnostics are re-printed as GitHub annotations. They are
      # readable through the checks API even when the raw job log cannot be
      # downloaded, which is what makes a red build self-explanatory.
      - name: Surface test failures as annotations
        if: failure()
        run: python3 tools/ci_annotate.py build.log

      - name: Publish unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn

      # Only the release variant is built. It is the artifact that is
      # delivered (Telegram) and the one that ships: R8 + resource shrinking
      # on, signed with the release keystore when one is configured. The
      # emulator jobs below build their own *debug* variant with
      # `-PSMOKE_TEST_BUILD=true`, because their DevTools-driven checks need a
      # debuggable WebView.
      - name: Build release APK (R8 / resource shrinking enabled)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee -a build.log

      - name: Surface build failures as annotations
        if: failure()
        run: python3 tools/ci_annotate.py build.log

      # Real verification of the produced artifact: the WebApp bundle must be
      # packaged, every font/resource must resolve and the removed advertising
      # SDK must not reappear anywhere (classes, assets or resources).
      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v -e 'unsigned' | head -1)
          ls -lh "$APK"
          echo "--- packaged WebApp bundle ---"
          unzip -l "$APK" | grep -E 'assets/web/' | head -20 || true
          echo "--- fonts / native resources ---"
          # Release builds shorten resource paths (aapt2 resource
          # optimizations), so the Vazirmatn fonts are counted instead of
          # matched by their directory name.
          TTF_COUNT=$(unzip -l "$APK" | grep -cE '\.(ttf|woff2?)$' || true)
          echo "font files packaged: $TTF_COUNT"
          if [ "$TTF_COUNT" -lt 5 ]; then
            echo "::error::Vazirmatn fonts missing from the APK (found $TTF_COUNT font files)"
            unzip -l "$APK" | grep -iE 'font|\.ttf|\.woff' | head -20 || true
            exit 1
          fi
          unzip -l "$APK" | grep -cE 'resources.arsc|classes.dex'
          rm -rf /tmp/apk-inspect && mkdir -p /tmp/apk-inspect
          (cd /tmp/apk-inspect && unzip -q "$GITHUB_WORKSPACE/$APK")
          test -f /tmp/apk-inspect/assets/web/index.html
          if [ -f /tmp/apk-inspect/assets/web/native-bridge.js ] || [ -f /tmp/apk-inspect/assets/web/js/native-bridge.js ]; then
            echo "native-bridge.js present"
          else
            echo "::error::native-bridge.js missing (expected assets/web/native-bridge.js or assets/web/js/native-bridge.js)"
            ls -R /tmp/apk-inspect/assets/web | head -30 || true
            exit 1
          fi
          echo "--- advertising SDK scan ---"
          if grep -ril 'adivery' /tmp/apk-inspect 2>/dev/null | head -5 | grep -q .; then
            echo "::error::Removed advertising SDK is still packaged"
            grep -ril 'adivery' /tmp/apk-inspect | head -5 || true
            exit 1
          fi
          echo "clean: no trace of the removed advertising SDK"
          echo "--- removed push SDK scan ---"
          if grep -rql 'com/najva' /tmp/apk-inspect/classes*.dex; then
            echo "::error::Removed push SDK (Najva) is still packaged"
            exit 1
          fi
          echo "--- Tapsell / Pushfa / Poolakey / app package presence ---"
          for needle in ir/tapsell com/pushfa/sdk ir/cafebazaar com/chistan/quickgames; do
            if grep -rql "$needle" /tmp/apk-inspect/classes*.dex; then
              echo "present: $needle"
            else
              echo "::error::$needle missing from the APK"
              exit 1
            fi
          done
          echo "--- bridge + readiness contract ---"
          grep -rq 'appReady' /tmp/apk-inspect/classes*.dex && echo "appReady exported"
          grep -rq 'AndroidBridge' /tmp/apk-inspect/classes*.dex && echo "AndroidBridge exported"

      # What the advertising SDK does to *our* process is not documented:
      # the merged manifest shows its Activities (orientation, theme, config
      # handling) and a constant-pool scan of its classes shows whether it
      # touches process-wide WebView state (pauseTimers), the orientation or
      # the window – the things that can break the game after an ad closes.
      - name: Inspect the ad SDK (manifest + WebView / orientation usage)
        run: python3 tools/inspect_ad_sdk.py

      # The APK is delivered to the owner's Telegram chat and is *never*
      # uploaded as a build artifact: repository secrets TELEGRAM_BOT_TOKEN and
      # TELEGRAM_CHAT_ID (optional TELEGRAM_MESSAGE_THREAD_ID for a forum
      # topic) are the only configuration needed. Secrets are not exposed to
      # pull requests from forks, so the delivery is skipped there with a
      # warning – such a run is about the code, not about shipping an APK. On a
      # real build (push / manual dispatch) the delivery is a required step: if
      # Telegram rejects the APK the job goes red, because there is no artifact
      # to fall back to.
      - name: Telegram delivery configured?
        id: telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not configured – the release APK cannot be delivered to Telegram. Add both repository secrets (see README §4)."
          fi

      - name: Send release APK to Telegram
        id: telegram_send
        if: steps.telegram.outputs.enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          set -uo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | grep -v -e 'unsigned' | head -1 || true)
          if [ -z "$APK" ]; then
            echo "::error::no release APK found in app/build/outputs/apk/release/"
            exit 1
          fi
          if ! APK="$APK" bash tools/send_apk_telegram.sh "$APK" "چیستان‌سرا · release"; then
            echo "::error::Telegram delivery failed – the APK is not uploaded as an artifact, re-run this job to rebuild and send it again."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Runtime verification on a real Android system image: the app is installed,
  # launched, screenshotted and checked against the boot contract. This is the
  # only place where the WebView, the local HTTP server and the JS bridge run
  # together.
  # ---------------------------------------------------------------------------
  smoke:
    name: Emulator smoke test (boot contract + screenshots)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # posts the screenshots/report as commit comments

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Ensure Gradle wrapper
        run: |
          chmod +x gradlew || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Provision Gradle distribution
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then exit 0; fi
            rm -rf "$HOME/.gradle/wrapper/dists"/*/gradle-8.5-bin.zip.lck || true
            sleep 15
          done
          exit 1

      # The contract test runs against a key-less build: with the production
      # Tapsell / Pushfa identifiers the emulator would fire real ad requests
      # from a US data-centre IP and a served interstitial takes the screen
      # (and the back button) away from the WebApp – exactly what the test
      # must not depend on. The SDKs themselves are still packaged and their
      # presence is verified by the `build` job above.
      - name: Build debug APK (ads / push identifiers blanked)
        run: ./gradlew assembleDebug --no-daemon -PSMOKE_TEST_BUILD=true

      # The play-through (tools/game-tests/emulator_play.mjs) talks to the
      # WebView over the DevTools protocol; `ws` is only needed on Node < 22.
      - name: Node helpers for the DevTools play-through
        run: |
          node --version
          npm install --no-save --no-audit --no-fund ws@8 2>&1 | tail -2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash tools/emulator_smoke.sh

      - name: Publish smoke test results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/publish_smoke_report.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: ci-artifacts/**
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Ad lab: the game through a REAL Tapsell (test) interstitial. The SDK runs
  # with its official test app key / zones, on a newer system image whose
  # WebView renders the Tailwind v4 bundle faithfully (oklch colours need
  # Chromium 111+). Records the container's lifecycle, the page's events and
  # the frames right after the ad closes; fails only when the round trip
  # happened and the game came back broken.
  # ---------------------------------------------------------------------------
  adlab:
    name: Emulator ad lab (real Tapsell test interstitial)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # posts the report/screenshots as commit comments

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Ensure Gradle wrapper
        run: |
          chmod +x gradlew || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Provision Gradle distribution
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then exit 0; fi
            rm -rf "$HOME/.gradle/wrapper/dists"/*/gradle-8.5-bin.zip.lck || true
            sleep 15
          done
          exit 1

      - name: Build debug APK (Tapsell test keys, push blanked)
        run: ./gradlew assembleDebug --no-daemon -PSMOKE_TEST_BUILD=true -PSMOKE_TEST_ADS=true

      - name: Node helpers for the DevTools session
        run: |
          node --version
          npm install --no-save --no-audit --no-fund ws@8 2>&1 | tail -2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Ad lab on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash tools/emulator_ad_lab.sh

      - name: Publish ad lab results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: ci-artifacts-adlab
          PICTURES: "30-adlab-* 32-adlab-* 33-adlab-01 34-adlab-* 35-adlab-* 39-adlab-*"
        run: bash tools/publish_smoke_report.sh

      - name: Upload ad lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-ad-lab
          path: ci-artifacts-adlab/**
          if-no-files-found: warn
